<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="index.css">
</head>
<body>
    <center>
    
<div class="container">

<!--LEFT TEXT
    <div class="tagline">
        <h2>A simple web calculator built using HTML, CSS, and JavaScript.</h2>
    </div>

        <h1 class="heading">Ready to Calculate?</h1>-->

<!--CALCULATOR-->        
<div class="parent">
<div class="outer">
<div class="inner">

   <!-- <h1 class="calc">CALCULATOR</h1>-->

    <input type="text" id="display" readonly> <br> <br>

    <div>
    <button class="lavender" onclick="clearDisplay()">C</button> <button class="lavender" data-key="Backspace" onclick="deleteLast()">⌫</button> <button class="lavender" data-key="%" onclick="addOperator('%')">%</button> <button class="lavender" data-key="/" onclick="addOperator('/')">/</button> <br> <br>
    <button class="periwinkle" data-key="7" onclick="press('7')">7</button> <button class="periwinkle" data-key="8" onclick="press('8')">8</button> <button class="periwinkle" data-key="9" onclick="press('9')">9</button> <button class="periwinkle" data-key="*" onclick="addOperator('*')">*</button> <br> <br>
    <button class="wisteria" data-key="4" onclick="press('4')">4</button> <button class="wisteria" data-key="5" onclick="press('5')">5</button> <button class="wisteria" data-key="6" onclick="press('6')">6</button> <button class="wisteria" data-key="-" onclick="addOperator('-')">-</button> <br> <br>
    <button class="floral" data-key="1" onclick="press('1')">1</button> <button class="floral" data-key="2" onclick="press('2')">2</button> <button class="floral" data-key="3" onclick="press('3')">3</button> <button class="floral" data-key="+" onclick="addOperator('+')">+</button> <br> <br>
    <button class="amethyst" data-key="0" onclick="press('0')">0</button> <button class="amethyst" data-key="." onclick="addDecimal('.')">.</button> <button class="amethyst" id="result" onclick="calculateResult()">=</button> 
    </div>

</div>
</div>
</div>

<!--RIGHT IMAGE
<div class="sideimg">
        <figure>
            <img src="calc.jpg" height="250" id="imgborder">
            <figcaption id="fig"><strong>AAAAAAAAA......</strong></figcaption>
        </figure>
        </div>-->
    
</div>

</center>
<script src="script.js"></script>
</body>
</html>
